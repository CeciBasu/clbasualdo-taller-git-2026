spring.application.name=minecraft

spring.datasource.url=jdbc:h2:file:./data/entidades
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Puerto propio dentro del grupo (A1). Irina usa el 8082 y Sol el 8080.
server.port=${PORT:8083}

# OpenAPI (springdoc): /v3/api-docs, /v3/api-docs.yaml y /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Compañeros del grupo. Por defecto apuntan a las IPs del grupo; se pueden cambiar con A2_BASE_URL y A3_BASE_URL.
companeros.timeout-ms=3000
companeros.a2.rol=A2
companeros.a2.nombre=Irina Insfr\u00e1n
companeros.a2.base-url=${A2_BASE_URL:http://100.87.95.24:8082}
companeros.a2.ruta=${A2_RUTA:/api/minecraft/reglas/mecha-corta}
companeros.a2.regla=mecha corta
companeros.a2.openapi=${companeros.a2.base-url}/v3/api-docs
companeros.a3.rol=A3
companeros.a3.nombre=${A3_NOMBRE:Sol}
companeros.a3.base-url=${A3_BASE_URL:http://100.87.131.50:8080}
companeros.a3.ruta=${A3_RUTA:/explosiones/validar}
companeros.a3.regla=${A3_REGLA:regla de A3}
companeros.a3.openapi=${companeros.a3.base-url}/v3/api-docs
